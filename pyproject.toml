[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pcss"
version = "0.3.0"
description = "Polynomial secret sharing + evaluation-consistency proofs + FastAPI/JWT/RBAC (research prototype)"
readme = "README.md"
requires-python = ">=3.9"
# The algorithm core (pcss/) and the Tkinter GUI use only the standard library.
dependencies = []

[project.optional-dependencies]
# REST API. Lower bounds support Python 3.9; pip picks newer releases on newer Pythons.
api = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "sqlalchemy>=2.0",
    "pyjwt>=2.8",
    "python-multipart>=0.0.9",
]
dev = [
    "pytest>=7",
    "httpx>=0.27",
    "numpy",   # only for tests/test_legacy_regressions.py
    "sympy",   # only for tests/test_legacy_regressions.py
]

[tool.setuptools]
packages = ["pcss", "app", "app.api", "app.schemas", "app.services", "app.security", "app.storage", "gui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 110
extend-exclude = ["legacy"]   # original thesis code is kept unchanged

[tool.ruff.lint]
select = ["E", "F", "W", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body"]
