[project]
name = "pcss"
version = "0.2.0"
description = "Polynomial-commitment-style verifiable secret sharing (teaching / research prototype)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["pcss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
